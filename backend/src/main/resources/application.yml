spring:
  application:
    name: acougue-erp

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/acougue_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  jackson:
    serialization:
      write-dates-as-timestamps: false
    time-zone: America/Sao_Paulo

  # ── Kafka ──────────────────────────────────────────────────────────────────
  # Upstash: KAFKA_BOOTSTRAP_SERVERS, KAFKA_SASL_USERNAME, KAFKA_SASL_PASSWORD
  # Habilitar: Railway → Variables → KAFKA_ENABLED=true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: acougue-erp
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.acougue.modules.messaging.events"
        spring.json.use.type.headers: false

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    com.acougue: DEBUG
    org.hibernate.SQL: WARN

acougue:
  cors:
    allowed-origins: ${ACOUGUE_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  nfce:
    ambiente: 2     # 1=Produção, 2=Homologação
    uf: 35          # SP=35, ajuste conforme seu estado

# ── Kafka feature flag + SASL (Upstash/Confluent) ──────────────────────────
# SASL_SSL=Upstash | PLAINTEXT=local Docker
kafka:
  enabled: ${KAFKA_ENABLED:false}
  sasl:
    username: ${KAFKA_SASL_USERNAME:}
    password: ${KAFKA_SASL_PASSWORD:}
  security:
    protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}

pagamento:
  pix:
    # Gere em: https://www.mercadopago.com.br/developers/panel/credentials
    mp-access-token: ${MP_ACCESS_TOKEN:}
  stone:
    # URL do agente Stone TEF instalado localmente (padrão Stone: 12345)
    agent-url: ${STONE_AGENT_URL:http://localhost:12345}
