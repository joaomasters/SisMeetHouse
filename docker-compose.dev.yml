version: "3.9"

# ─────────────────────────────────────────────────────────────────
#  DEV ONLY — sobe apenas o PostgreSQL para rodar o backend
#  direto no IntelliJ sem precisar buildar imagem Docker.
#
#  Uso:
#    docker compose -f docker-compose.dev.yml up -d
#    docker compose -f docker-compose.dev.yml down
# ─────────────────────────────────────────────────────────────────

services:

  postgres:
    image: postgres:15-alpine
    container_name: acougue_db_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB:       acougue_db
      POSTGRES_USER:     acougue
      POSTGRES_PASSWORD: acougue@2025
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acougue -d acougue_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
